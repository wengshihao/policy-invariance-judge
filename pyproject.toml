[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-invariance-judge"
version = "1.0.0"
description = "Three-principle stress-test for LLM safety judges."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
include = ["pij*"]
